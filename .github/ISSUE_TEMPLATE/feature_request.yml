name: Feature request
description: Suggest a feature or an improvement.
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the task you are trying to accomplish.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Suggested behavior
      description: Explain how the feature would work from a user's perspective.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include any existing workaround or simpler solution.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Optional mockups, examples, or OS-specific requirements.
