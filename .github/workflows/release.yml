name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            asset: macos-arm64
          - os: macos-15-intel
            asset: macos-x64
          - os: windows-2025
            asset: windows-x64
          - os: ubuntu-24.04
            asset: linux-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Install Linux desktop libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-0t64
      - name: Test and package
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          args=()
          if [[ "$RELEASE_REF" == refs/tags/* ]]; then
            version="${RELEASE_TAG#v}"
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo 'Use a tag in the form v1.2.3 matching pom.xml.' >&2
              exit 1
            fi
            args+=(--version "$version")
          fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            python -m unittest discover -s scripts/tests -v
            python scripts/package.py "${args[@]}"
          else
            python3 -m unittest discover -s scripts/tests -v
            python3 scripts/package.py "${args[@]}"
          fi
      - name: Check Windows installer and portable downloads
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem target/releases/*-windows-x64-setup.exe)
          if ($installers.Count -ne 1) { throw 'Expected exactly one Windows setup EXE.' }
          $portable = @(Get-ChildItem target/releases/*-windows-x64.zip)
          if ($portable.Count -ne 1) { throw 'Expected exactly one Windows portable ZIP.' }
          foreach ($download in @($installers[0], $portable[0])) {
            $checksum = "$($download.FullName).sha256"
            if (-not (Test-Path $checksum)) { throw "Missing checksum for $($download.Name)." }
            $expected = ((Get-Content $checksum -Raw).Trim() -split '\s+')[0]
            $actual = (Get-FileHash $download.FullName -Algorithm SHA256).Hash
            if ($expected -ne $actual) { throw "Checksum mismatch for $($download.Name)." }
          }
          $expanded = Join-Path $env:RUNNER_TEMP 'steamstone-portable-check'
          Expand-Archive -Path $portable[0].FullName -DestinationPath $expanded
          $launcher = Join-Path $expanded 'SteamStone/SteamStone.exe'
          $probe = Start-Process -FilePath $launcher -ArgumentList '--check-runtime' `
            -WorkingDirectory $env:RUNNER_TEMP -Wait -PassThru
          if ($probe.ExitCode -ne 0) { throw 'The extracted portable app failed its runtime check.' }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ matrix.asset }}
          path: target/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: downloads
          merge-multiple: true
      - name: Verify checksums
        working-directory: downloads
        run: |
          for checksum in *.sha256; do
            sha256sum --check "$checksum"
          done
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" downloads/* \
            --verify-tag --draft --title "SteamStone ${RELEASE_TAG#v}" --generate-notes
